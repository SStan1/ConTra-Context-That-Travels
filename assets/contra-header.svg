      <rect x="130" y="313" width="58" height="27" rx="13.5" fill="#35426e"/><text x="159" y="332">2B</text>
      <rect x="198" y="313" width="58" height="27" rx="13.5" fill="#35426e"/><text x="227" y="332">4B</text>
    </g>
    <text x="608" y="67" fill="#bac6ed" font-size="12" letter-spacing="2">ONE PREFIX. THE WHOLE JOURNEY.</text>

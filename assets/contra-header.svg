<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ConTra — Context That Travels</title>
  <desc id="desc">The same context prefix accompanies its passage from generation through retrieval and reranking along a continuous route.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141933"/><stop offset="1" stop-color="#242e58"/></linearGradient>
    <linearGradient id="route" x2="1"><stop stop-color="#7f8fff" stop-opacity=".3"/><stop offset=".35" stop-color="#aeb8ff"/><stop offset="1" stop-color="#aeb8ff"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="960" cy="206" r="195" fill="#8c9aff" fill-opacity=".025"/>
  <circle cx="960" cy="206" r="147" fill="none" stroke="#a1adff" stroke-opacity=".065"/>
  <circle cx="960" cy="206" r="110" fill="none" stroke="#a1adff" stroke-opacity=".055"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="54" y="52" width="5" height="20" rx="2" fill="#a5afff"/>
    <text x="73" y="67" fill="#c1c9e7" font-size="13" letter-spacing="2">MULTI-STAGE CONTEXTUAL RETRIEVAL</text>
    <text x="50" y="173" fill="#fff" font-size="94" font-weight="700" letter-spacing="-4">Con<tspan fill="#b3bcff">Tra</tspan></text>
    <text x="55" y="224" fill="#edf0ff" font-size="30">Context That Travels</text>
    <text x="56" y="268" fill="#b7c1e3" font-size="17">From source to search, context stays with the chunk.</text>
    <g font-size="13" text-anchor="middle" fill="#e1e6fc">
